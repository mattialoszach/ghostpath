[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostpath"
version = "0.1.0"
description = "Hand-guided SO-101 teaching and LeRobot dataset collection"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "numpy>=2,<3",
    "pillow>=11,<13",
    "pyserial>=3.5,<4",
]

[project.optional-dependencies]
record = ["lerobot[dataset]==0.7.0"]
hardware = [
    "lerobot[hardware,feetech,dataset]==0.7.0",
    "pyobjc-framework-AVFoundation>=12; sys_platform == 'darwin'",
    "pyobjc-framework-libdispatch>=12; sys_platform == 'darwin'",
]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11"]

[project.scripts]
ghostpath = "ghostpath.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
